name: "Reusable Stategraph Pipeline"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment / workspace (dev, prod, etc.)"
      working_directory:
        required: false
        type: string
        default: "."
        description: "Directory containing the root Terraform configuration and stategraph.json"
      var_file:
        required: true
        type: string
        description: "Relative path to variables file (e.g. environments/dev.tfvars)"
      terraform_version:
        required: false
        type: string
        default: "1.9.5"
      azure_client_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Client ID. Defaults to vars.AZURE_CLIENT_ID from environment."
      azure_tenant_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Tenant ID. Defaults to vars.AZURE_TENANT_ID."
      azure_subscription_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Subscription ID. Defaults to vars.AZURE_SUBSCRIPTION_ID from environment."

jobs:
  validate_and_plan:
    name: "Validate & Plan (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      AZURE_CLIENT_ID: ${{ inputs.azure_client_id != '' && inputs.azure_client_id || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ inputs.azure_tenant_id != '' && inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id != '' && inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}
      STATEGRAPH_API_BASE: ${{ vars.STATEGRAPH_API_BASE }}
      STATEGRAPH_TENANT_ID: ${{ vars.STATEGRAPH_TENANT_ID }}
      STATEGRAPH_API_KEY: ${{ secrets.STATEGRAPH_API_KEY }}
      TF_CMD: "terraform"
      ARM_CLIENT_ID: ${{ inputs.azure_client_id != '' && inputs.azure_client_id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure_tenant_id != '' && inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id != '' && inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Check Formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ inputs.working_directory }}

      - name: Install Stategraph CLI
        run: |
          curl -fsSL https://get.stategraph.com/install.sh | sudo sh

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Stategraph Plan
        id: plan
        run: |
          stategraph tf plan \
            --workspace="${{ inputs.environment }}" \
            --var-file="${{ inputs.var_file }}" \
            --no-color 2>&1 | tee plan_output.txt

          SUMMARY_LINE=$(grep -E "(Plan: [0-9]+ to add|No changes\.)" plan_output.txt | head -n 1 || echo "Plan completed successfully")

          echo "## 📋 Stategraph Plan: \`${{ inputs.working_directory }}\` (\`${{ inputs.environment }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: \`${SUMMARY_LINE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full execution details are available in the runner step logs." >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ inputs.working_directory }}

  apply:
    name: "Apply (${{ inputs.environment }})"
    needs: validate_and_plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ inputs.azure_client_id != '' && inputs.azure_client_id || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ inputs.azure_tenant_id != '' && inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id != '' && inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}
      STATEGRAPH_API_BASE: ${{ vars.STATEGRAPH_API_BASE }}
      STATEGRAPH_TENANT_ID: ${{ vars.STATEGRAPH_TENANT_ID }}
      STATEGRAPH_API_KEY: ${{ secrets.STATEGRAPH_API_KEY }}
      TF_CMD: "terraform"
      ARM_CLIENT_ID: ${{ inputs.azure_client_id != '' && inputs.azure_client_id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure_tenant_id != '' && inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id != '' && inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Install Stategraph CLI
        run: |
          curl -fsSL https://get.stategraph.com/install.sh | sudo sh

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Stategraph Apply
        run: |
          stategraph tf apply \
            --workspace="${{ inputs.environment }}" \
            --var-file="${{ inputs.var_file }}" \
            --auto-approve 2>&1 | tee apply_output.txt

          APPLY_SUMMARY=$(grep -E "(Apply complete!|Destroy complete!|No changes\.)" apply_output.txt | head -n 1 || echo "Apply completed successfully")

          echo "## 🚀 Stategraph Apply: \`${{ inputs.working_directory }}\` (\`${{ inputs.environment }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: \`${APPLY_SUMMARY}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full execution details are available in the runner step logs." >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ inputs.working_directory }}
