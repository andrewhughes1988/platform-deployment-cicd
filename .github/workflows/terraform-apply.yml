name: "Reusable Terraform Apply"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (dev, test, preprod, prod)"
      working_directory:
        required: false
        type: string
        default: "."
        description: "Directory containing the root Terraform configuration"
      backend_config_file:
        required: true
        type: string
        description: "Relative path to backend config (e.g. environments/dev/backend.tfvars)"
      var_file:
        required: true
        type: string
        description: "Relative path to variables file (e.g. environments/dev/terraform.tfvars)"
      terraform_version:
        required: false
        type: string
        default: "1.9.5"
      azure_client_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Client ID. Defaults to vars.AZURE_CLIENT_ID from environment."
      azure_tenant_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Tenant ID. Defaults to vars.AZURE_TENANT_ID."
      azure_subscription_id:
        required: false
        type: string
        default: ""
        description: "Optional override for Azure Subscription ID. Defaults to vars.AZURE_SUBSCRIPTION_ID from environment."

jobs:
  apply:
    name: "Apply (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ inputs.azure_client_id != '' && inputs.azure_client_id || vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ inputs.azure_tenant_id != '' && inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id != '' && inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="${{ inputs.backend_config_file }}"
        working-directory: ${{ inputs.working_directory }}
        env:
          ARM_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="${{ inputs.var_file }}" \
            -lock-timeout=15m \
            -auto-approve | tee apply_output.txt

          APPLY_SUMMARY=$(grep -E "(Apply complete!|No changes\.)" apply_output.txt | head -n 1 || echo "Apply finished")

          echo "## 🚀 Terraform Apply: \`${{ inputs.working_directory }}\` (\`${{ inputs.environment }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: \`${APPLY_SUMMARY}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full execution details are available in the step logs." >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ inputs.working_directory }}
        env:
          ARM_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"

